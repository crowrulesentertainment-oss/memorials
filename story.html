<style>

:root{
  --bg:#050505;
  --bg2:#090909;
  --panel:#0d0d0d;
  --panel2:#111;
  --line:#242424;
  --line2:#303030;

  --text:#eeeae1;
  --muted:#858585;
  --dim:#555;

  --gold:#c9a85f;
  --gold2:#e2cc91;
  --gold3:#80652f;

  --reader:#d8d3c8;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  color:var(--text);

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(201,168,95,.08),
      transparent 35%
    ),
    var(--bg);

  font-family:Montserrat,Arial,sans-serif;
}

body:before{
  content:"";

  position:fixed;
  inset:0;
  z-index:-1;

  pointer-events:none;

  opacity:.016;

  background-image:
    linear-gradient(
      rgba(255,255,255,.6) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.6) 1px,
      transparent 1px
    );

  background-size:55px 55px;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   GLOBAL
========================================================= */

.container{
  width:min(1280px,calc(100% - 36px));
  margin:auto;
}

.kicker{
  color:var(--gold);

  font-family:Orbitron,sans-serif;

  font-size:8px;
  font-weight:700;

  letter-spacing:4px;

  text-transform:uppercase;
}

.btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:7px;

  min-height:39px;

  padding:10px 14px;

  color:#999;

  background:#0d0d0d;

  border:1px solid #292929;

  border-radius:7px;

  font-size:8px;
  font-weight:800;

  letter-spacing:.8px;
}

.btn:hover{
  color:var(--gold2);

  border-color:var(--gold);
}

.btn.gold{
  color:#050505;

  background:var(--gold);

  border-color:var(--gold);
}

.btn.gold:hover{
  background:var(--gold2);
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;

  background:rgba(5,5,5,.95);

  border-bottom:1px solid rgba(255,255,255,.06);

  backdrop-filter:blur(18px);
}

.header-inner{
  min-height:76px;

  display:flex;
  align-items:center;

  gap:24px;
}

.brand{
  display:flex;
  align-items:center;

  gap:12px;
}

.brand-mark{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border:1px solid var(--gold);

  transform:rotate(45deg);
}

.brand-mark span{
  color:var(--gold2);

  font-family:Orbitron,sans-serif;

  font-size:10px;
  font-weight:800;

  transform:rotate(-45deg);
}

.brand-text strong{
  display:block;

  font-family:Orbitron,sans-serif;

  font-size:14px;

  letter-spacing:2px;
}

.brand-text small{
  display:block;

  margin-top:3px;

  color:#5c5c5c;

  font-size:8px;

  letter-spacing:3px;

  text-transform:uppercase;
}

.main-nav{
  display:flex;
  align-items:center;

  gap:2px;

  margin-left:auto;
}

.main-nav a{
  padding:9px 10px;

  color:#858585;

  border-radius:7px;

  font-size:9px;
  font-weight:600;
}

.main-nav a:hover,
.main-nav a.active{
  color:var(--gold2);

  background:rgba(201,168,95,.08);
}

.create-btn{
  padding:11px 15px;

  color:#050505;

  background:var(--gold);

  border:1px solid var(--gold);

  border-radius:7px;

  font-size:8px;
  font-weight:800;

  letter-spacing:1px;
}

.mobile-toggle{
  display:none;

  width:42px;
  height:42px;

  margin-left:auto;

  color:#ddd;

  background:#111;

  border:1px solid var(--line);

  border-radius:8px;
}

.mobile-menu{
  display:none;

  padding:8px 0 16px;

  border-top:1px solid #171717;
}

.mobile-menu.open{
  display:block;
}

.mobile-menu a{
  display:block;

  padding:11px 4px;

  color:#888;

  font-size:10px;
}

/* =========================================================
   READER HERO
========================================================= */

.story-hero{
  position:relative;

  min-height:520px;

  display:flex;
  align-items:flex-end;

  overflow:hidden;

  border-bottom:1px solid var(--line);

  background:#080808;
}

.hero-background{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 70% 30%,
      rgba(201,168,95,.1),
      transparent 35%
    );
}

.hero-background img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  opacity:.28;

  filter:grayscale(.25);
}

.hero-background:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(5,5,5,.3),
      rgba(5,5,5,.85) 62%,
      #050505 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;

  width:100%;

  padding:80px 0 55px;
}

.breadcrumb{
  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:25px;

  color:#555;

  font-size:8px;
}

.breadcrumb a:hover{
  color:var(--gold2);
}

.breadcrumb span{
  color:#353535;
}

.story-label{
  display:inline-flex;

  align-items:center;

  gap:9px;

  padding:7px 10px;

  color:var(--gold2);

  background:rgba(201,168,95,.07);

  border:1px solid rgba(201,168,95,.2);

  border-radius:5px;

  font-size:7px;
  font-weight:800;

  letter-spacing:1.7px;

  text-transform:uppercase;
}

.story-label:before{
  content:"";

  width:5px;
  height:5px;

  background:var(--gold);

  border-radius:50%;
}

.story-title{
  max-width:1000px;

  margin-top:19px;

  font-family:Orbitron,sans-serif;

  font-size:clamp(38px,6vw,74px);

  line-height:1.02;

  letter-spacing:-3px;
}

.story-meta{
  display:flex;

  align-items:center;

  gap:18px;

  margin-top:22px;

  flex-wrap:wrap;

  color:#777;

  font-size:9px;
}

.story-meta strong{
  color:var(--gold2);
}

.meta-divider{
  width:1px;
  height:14px;

  background:#333;
}

.hero-actions{
  display:flex;

  gap:8px;

  margin-top:28px;

  flex-wrap:wrap;
}

/* =========================================================
   READER
========================================================= */

.reader-section{
  padding:85px 0 100px;
}

.reader-layout{
  display:grid;

  grid-template-columns:
    minmax(0,820px)
    300px;

  justify-content:center;

  gap:70px;

  align-items:start;
}

/* =========================================================
   ARTICLE
========================================================= */

.article{
  min-width:0;
}

.article-intro{
  margin-bottom:42px;

  padding-bottom:30px;

  border-bottom:1px solid var(--line);
}

.article-intro p{
  color:#888;

  font-family:"Libre Baskerville",Georgia,serif;

  font-size:16px;

  line-height:2;
}

.story-body{
  color:var(--reader);

  font-family:"Libre Baskerville",Georgia,serif;

  font-size:17px;

  line-height:2.05;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.story-body::first-letter{
  color:var(--gold2);

  font-size:3.7em;

  float:left;

  line-height:.8;

  padding:9px 12px 0 0;
}

.story-footer{
  margin-top:55px;

  padding-top:25px;

  border-top:1px solid var(--line);

  color:#555;

  font-family:Montserrat,sans-serif;

  font-size:8px;

  line-height:1.8;
}

.story-footer strong{
  color:#888;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:sticky;
  top:105px;
}

.side-card{
  overflow:hidden;

  background:#0b0b0b;

  border:1px solid var(--line);

  border-radius:14px;
}

.memorial-image{
  height:230px;

  background:#111;
}

.memorial-image img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.image-placeholder{
  width:100%;
  height:100%;

  display:grid;
  place-items:center;

  background:
    radial-gradient(
      circle,
      rgba(201,168,95,.08),
      transparent 60%
    );
}

.placeholder-ring{
  width:75px;
  height:75px;

  display:grid;
  place-items:center;

  color:var(--gold);

  border:1px solid rgba(201,168,95,.3);

  border-radius:50%;

  font-family:Orbitron,sans-serif;

  font-size:11px;
}

.side-content{
  padding:22px;
}

.side-label{
  color:var(--gold);

  font-size:7px;
  font-weight:800;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.side-content h2{
  margin-top:8px;

  font-family:Orbitron,sans-serif;

  font-size:19px;

  line-height:1.25;
}

.life-dates{
  margin-top:6px;

  color:var(--gold2);

  font-size:9px;
}

.location{
  margin-top:7px;

  color:#555;

  font-size:8px;
}

.side-bio{
  margin-top:16px;

  color:#686868;

  font-size:9px;

  line-height:1.8;
}

.side-actions{
  display:flex;

  flex-direction:column;

  gap:7px;

  margin-top:20px;
}

.side-actions .btn{
  width:100%;
}

.side-stat-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:7px;

  margin-top:20px;
}

.side-stat{
  padding:11px;

  background:#090909;

  border:1px solid #1d1d1d;

  border-radius:7px;

  text-align:center;
}

.side-stat strong{
  display:block;

  color:var(--gold2);

  font-family:Orbitron,sans-serif;

  font-size:15px;
}

.side-stat span{
  display:block;

  margin-top:4px;

  color:#4e4e4e;

  font-size:6px;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* =========================================================
   RELATED
========================================================= */

.related{
  padding:85px 0 100px;

  border-top:1px solid var(--line);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(201,168,95,.04),
      transparent 45%
    );
}

.related-heading{
  display:flex;

  justify-content:space-between;
  align-items:end;

  gap:25px;

  margin-bottom:28px;
}

.related-heading h2{
  margin-top:10px;

  font-family:Orbitron,sans-serif;

  font-size:30px;
}

.related-heading p{
  max-width:430px;

  color:#5c5c5c;

  font-size:9px;

  line-height:1.7;

  text-align:right;
}

.related-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
}

.related-card{
  min-height:220px;

  display:flex;
  flex-direction:column;

  padding:21px;

  background:#0c0c0c;

  border:1px solid var(--line);

  border-radius:12px;

  transition:
    transform .25s ease,
    border-color .25s ease;
}

.related-card:hover{
  transform:translateY(-3px);

  border-color:rgba(201,168,95,.35);
}

.related-card .label{
  color:var(--gold);

  font-size:7px;
  font-weight:800;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.related-card h3{
  margin-top:10px;

  font-family:Orbitron,sans-serif;

  font-size:16px;

  line-height:1.35;
}

.related-excerpt{
  display:-webkit-box;

  overflow:hidden;

  margin-top:10px;

  color:#686868;

  font-size:9px;

  line-height:1.7;

  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
}

.related-meta{
  margin-top:auto;

  padding-top:17px;

  color:#4f4f4f;

  font-size:7px;
}

.read-link{
  display:inline-flex;

  margin-top:12px;

  color:var(--gold2);

  font-size:7px;
  font-weight:800;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* =========================================================
   LOADING / ERROR
========================================================= */

.state{
  min-height:520px;

  display:grid;
  place-items:center;

  text-align:center;
}

.state-inner{
  max-width:550px;

  padding:50px 25px;

  border:1px dashed #292929;

  border-radius:15px;
}

.state-icon{
  width:70px;
  height:70px;

  display:grid;
  place-items:center;

  margin:0 auto 20px;

  color:var(--gold);

  border:1px solid rgba(201,168,95,.25);

  border-radius:50%;

  font-family:Orbitron,sans-serif;
}

.state h2{
  font-family:Orbitron,sans-serif;

  font-size:22px;
}

.state p{
  margin-top:12px;

  color:#5f5f5f;

  font-size:9px;

  line-height:1.8;
}

/* =========================================================
   CANDLE MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;

  z-index:3000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.9);

  backdrop-filter:blur(12px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(500px,100%);

  padding:28px;

  background:#101010;

  border:1px solid #303030;

  border-radius:15px;

  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.modal-head{
  display:flex;

  justify-content:space-between;

  gap:20px;

  margin-bottom:22px;
}

.modal-head h2{
  font-family:Orbitron,sans-serif;

  font-size:19px;
}

.modal-head p{
  margin-top:6px;

  color:#666;

  font-size:9px;
}

.close{
  width:32px;
  height:32px;

  color:#777;

  background:none;

  border:0;

  font-size:25px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  margin-bottom:7px;

  color:#777;

  font-size:8px;

  letter-spacing:1.4px;

  text-transform:uppercase;
}

.field input,
.field textarea{
  width:100%;

  padding:12px;

  color:#eee;

  background:#080808;

  border:1px solid #292929;

  border-radius:7px;

  outline:none;

  resize:vertical;

  font-size:10px;
}

.field textarea{
  min-height:100px;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--gold);
}

.status{
  min-height:20px;

  margin-bottom:8px;

  color:#777;

  font-size:9px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:45px 0;

  background:#030303;

  border-top:1px solid var(--line);
}

.footer-grid{
  display:grid;

  grid-template-columns:2fr repeat(3,1fr);

  gap:30px;
}

.footer-title{
  color:var(--gold2);

  font-family:Orbitron,sans-serif;

  font-size:13px;

  letter-spacing:2px;
}

.footer-copy{
  max-width:390px;

  margin-top:12px;

  color:#4d4d4d;

  font-size:9px;

  line-height:1.8;
}

.footer-col h4{
  margin-bottom:12px;

  color:#666;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;
}

.footer-col a{
  display:block;

  margin:8px 0;

  color:#555;

  font-size:9px;
}

.footer-col a:hover{
  color:var(--gold2);
}

.copyright{
  margin-top:35px;

  padding-top:20px;

  color:#3b3b3b;

  border-top:1px solid #171717;

  text-align:center;

  font-size:8px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

  .main-nav,
  .create-btn{
    display:none;
  }

  .mobile-toggle{
    display:block;
  }

}

@media(max-width:1000px){

  .reader-layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:static;

    max-width:500px;
  }

  .related-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  .container{
    width:calc(100% - 24px);
  }

  .story-hero{
    min-height:500px;
  }

  .hero-content{
    padding:65px 0 42px;
  }

  .story-title{
    font-size:clamp(36px,11vw,58px);

    letter-spacing:-2px;
  }

  .story-meta{
    gap:10px;
  }

  .meta-divider{
    display:none;
  }

  .story-body{
    font-size:16px;

    line-height:1.95;
  }

  .article-intro p{
    font-size:15px;
  }

  .related-grid{
    grid-template-columns:1fr;
  }

  .related-heading{
    display:block;
  }

  .related-heading p{
    margin-top:10px;

    text-align:left;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }

}

</style>

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){

  if(!value){
    return "Date unknown";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "Date unknown";
  }

  return date.toLocaleDateString(
    undefined,
    {
      month:"long",
      day:"numeric",
      year:"numeric"
    }
  );

}

function formatLifeDates(memorial){

  const birth =
    memorial.birth_date
      ? new Date(
          memorial.birth_date +
          "T00:00:00"
        ).getFullYear()
      : null;

  const passing =
    memorial.passing_date
      ? new Date(
          memorial.passing_date +
          "T00:00:00"
        ).getFullYear()
      : null;

  if(birth && passing){
    return `${birth} — ${passing}`;
  }

  if(birth){
    return `${birth} —`;
  }

  if(passing){
    return `— ${passing}`;
  }

  return "Life remembered";

}

function excerpt(text,length=180){

  if(!text){
    return "";
  }

  const clean =
    String(text)
      .replace(/\s+/g," ")
      .trim();

  if(clean.length <= length){
    return clean;
  }

  return clean.slice(0,length).trim() + "…";

}

function getStoryId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}

/* =========================================================
   LOAD STORY
========================================================= */

async function loadStory(){

  const id =
    getStoryId();

  if(!id){

    renderError(
      "Story Not Found",
      "No story identifier was provided."
    );

    return false;
  }

  const {data,error} =
    await db
      .from("memorial_stories")
      .select(`
        id,
        memorial_id,
        title,
        story,
        author_name,
        published,
        created_at
      `)
      .eq("id",id)
      .eq("published",true)
      .maybeSingle();

  if(error){
    throw error;
  }

  if(!data){

    renderError(
      "Story Not Found",
      "This story may have been removed, unpublished or may no longer be available."
    );

    return false;
  }

  currentStory =
    data;

  const memorialResult =
    await db
      .from("memorials")
      .select(`
        id,
        slug,
        full_name,
        birth_date,
        passing_date,
        location,
        short_bio,
        portrait_url,
        featured,
        published
      `)
      .eq(
        "id",
        data.memorial_id
      )
      .eq(
        "published",
        true
      )
      .maybeSingle();

  if(memorialResult.error){
    throw memorialResult.error;
  }

  if(!memorialResult.data){

    renderError(
      "Memorial Unavailable",
      "The memorial connected to this story is no longer publicly available."
    );

    return false;
  }

  currentMemorial =
    memorialResult.data;

  return true;

}

/* =========================================================
   LOAD MEMORIAL COUNTS
========================================================= */

async function loadCounts(){

  const id =
    currentMemorial.id;

  const [
    candles,
    tributes,
    stories,
    photos
  ] = await Promise.all([

    db
      .from("memorial_candles")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq("memorial_id",id),

    db
      .from("memorial_tributes")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq("memorial_id",id),

    db
      .from("memorial_stories")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq("memorial_id",id)
      .eq("published",true),

    db
      .from("memorial_photos")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq("memorial_id",id)
      .eq("published",true)

  ]);

  return {
    candles:candles.count || 0,
    tributes:tributes.count || 0,
    stories:stories.count || 0,
    photos:photos.count || 0
  };

}

/* =========================================================
   LOAD RELATED STORIES
========================================================= */

async function loadRelated(){

  const {data,error} =
    await db
      .from("memorial_stories")
      .select(`
        id,
        memorial_id,
        title,
        story,
        author_name,
        created_at
      `)
      .eq(
        "published",
        true
      )
      .eq(
        "memorial_id",
        currentMemorial.id
      )
      .neq(
        "id",
        currentStory.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(3);

  if(error){
    console.error(
      "Related stories:",
      error
    );

    return [];
  }

  return data || [];

}

/* =========================================================
   CANDLE MODAL
========================================================= */

function openCandle(){

  if(!currentMemorial){
    return;
  }

  document.getElementById(
    "memorialId"
  ).value =
    currentMemorial.id;

  document.getElementById(
    "authorName"
  ).value = "";

  document.getElementById(
    "candleMessage"
  ).value = "";

  document.getElementById(
    "candleStatus"
  ).textContent =
    `Lighting a candle for ${currentMemorial.full_name}`;

  document.getElementById(
    "candleModal"
  ).classList.add("open");

  setTimeout(
    ()=>{
      document.getElementById(
        "authorName"
      ).focus();
    },
    50
  );

}

function closeCandle(){

  document.getElementById(
    "candleModal"
  ).classList.remove("open");

}

/* =========================================================
   CANDLE FORM
========================================================= */

document
  .getElementById("candleForm")
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      const memorialId =
        document.getElementById(
          "memorialId"
        ).value;

      const author =
        document.getElementById(
          "authorName"
        ).value.trim();

      const message =
        document.getElementById(
          "candleMessage"
        ).value.trim();

      const status =
        document.getElementById(
          "candleStatus"
        );

      if(!message){

        status.textContent =
          "Please enter a remembrance message.";

        return;
      }

      status.textContent =
        "Lighting candle…";

      const {error} =
        await db
          .from("memorial_candles")
          .insert({

            memorial_id:
              memorialId,

            author_name:
              author ||
              "Community Member",

            message:
              message

          });

      if(error){

        console.error(error);

        status.textContent =
          "Unable to light candle. Please try again.";

        return;
      }

      status.textContent =
        "Candle lit successfully.";

      setTimeout(
        closeCandle,
        800
      );

    }
  );
