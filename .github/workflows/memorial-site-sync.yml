name: Memorials site-wide sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[memorial-sync]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared Memorials engine to every page
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'assets/memorial-nav.js' "$file"; then
              python3 - "$file" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='</body>'
script='<script defer src="assets/memorial-nav.js?v=20260913"></script>'
if 'assets/memorial-nav.js' not in s:
    if needle in s:
        s=s.replace(needle, script+'\n'+needle, 1)
    else:
        s += '\n'+script+'\n'
    p.write_text(s,encoding='utf-8')
PY
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "[memorial-sync] Apply site-wide Memorials engine"
            git push
          fi
