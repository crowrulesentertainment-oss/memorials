name: Memorials site-wide sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared Memorials engine to every page
        shell: bash
        run: |
          set -e
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'assets/memorial-nav.js' "$file"; then
              printf '\n<script defer src="assets/memorial-nav.js?v=20260913"></script>\n' >> "$file"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "[memorial-sync] Apply site-wide Memorials engine"
            git push
          else
            echo "All root HTML pages already use the shared Memorials engine."
          fi
