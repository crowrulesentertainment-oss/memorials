name: Memorials site-wide sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync shared Memorials navigation and homepage upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          changed = []
          version = '20260913.7'

          for path in sorted(root.rglob('*.html')):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Remove older copies so every page has exactly one current shared loader.
              text = re.sub(
                  r'<script[^>]+src=["\'][^"\']*(?:\.\./)*assets/memorial-nav\.js(?:\?[^\s"\'<>]*)?["\'][^>]*></script>\s*',
                  '', text, flags=re.I)
              text = re.sub(
                  r'<script[^>]+src=["\'][^"\']*(?:\.\./)*assets/index-upgrade\.js(?:\?[^\s"\'<>]*)?["\'][^>]*></script>\s*',
                  '', text, flags=re.I)

              depth = len(path.parent.parts)
              prefix = '../' * depth
              nav_src = f'{prefix}assets/memorial-nav.js?v={version}'
              nav_tag = f'<script defer src="{nav_src}"></script>'

              if re.search(r'</head>', text, flags=re.I):
                  text = re.sub(r'</head>', f'{nav_tag}\n</head>', text, count=1, flags=re.I)
              else:
                  text = nav_tag + '\n' + text

              if path.name.lower() == 'index.html':
                  upgrade_src = f'{prefix}assets/index-upgrade.js?v=20260913.1'
                  upgrade_tag = f'<script defer src="{upgrade_src}"></script>'
                  if re.search(r'</head>', text, flags=re.I):
                      text = re.sub(r'</head>', f'{upgrade_tag}\n</head>', text, count=1, flags=re.I)
                  else:
                      text = upgrade_tag + '\n' + text

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Synced {len(changed)} HTML page(s).')
          for item in changed:
              print(f'  - {item}')
          PY

      - name: Verify every HTML page has current shared navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          expected = re.compile(r'assets/memorial-nav\.js\?v=20260913\.7', re.I)
          pages = [p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          missing = []

          for path in pages:
              text = path.read_text(encoding='utf-8')
              if not expected.search(text):
                  missing.append(str(path))

          if missing:
              print('ERROR: these HTML pages are missing the current shared navigation:')
              for item in missing:
                  print(f'  - {item}')
              raise SystemExit(1)

          print(f'Verified {len(pages)} HTML page(s): all have memorial-nav.js v20260913.7.')
          PY

      - name: Commit synchronized pages
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- . -- '*.html'; then
            echo 'All HTML pages are already synchronized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m '[memorial-sync] Synchronize all Memorials pages'
          git push
