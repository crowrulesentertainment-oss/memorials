name: Memorials Site Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-memorials:
    name: Validate Memorials site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML integration
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r -d '' file; do
            echo "Checking $file"

            if ! grep -qi 'assets/memorial-nav.js' "$file"; then
              echo "::error file=$file::Missing shared Memorials navigation"
              failed=1
            fi

            if ! grep -qi 'assets/js/crowrules-membership.js' "$file"; then
              echo "::error file=$file::Missing Universal CrowRules Membership"
              failed=1
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          if [ "$failed" -ne 0 ]; then
            echo "One or more HTML pages are missing required shared assets."
            exit 1
          fi

          echo "All Memorials HTML pages contain shared navigation and membership integration."

      - name: Validate required shared assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/memorial-nav.js
          test -f assets/js/crowrules-membership.js
          test -f assets/memorials.css
          test -f assets/memorials.js
          echo "Shared Memorials assets are present."

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/memorial-nav.js
          node --check assets/js/crowrules-membership.js
          node --check assets/memorials.js
          echo "Shared JavaScript syntax is valid."
