name: Integrate Universal CrowRules Membership

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Memorials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject Universal CrowRules Membership and Navigation into every HTML page
        shell: bash
        run: |
          set -euo pipefail

          css='<link rel="stylesheet" href="assets/css/crowrules-membership.css">'
          nav='<script src="assets/memorial-nav.js"></script>'
          js='<script src="assets/js/crowrules-membership.js"></script>'

          while IFS= read -r file; do
            [ -f "$file" ] || continue

            python3 - "$file" "$css" "$nav" "$js" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
css = sys.argv[2]
nav = sys.argv[3]
js = sys.argv[4]

text = path.read_text(encoding="utf-8")

if "</head>" not in text.lower():
    raise SystemExit(f"No closing </head> found in {path}")

injection_parts = []
if "assets/css/crowrules-membership.css" not in text:
    injection_parts.append(css)
if "assets/memorial-nav.js" not in text:
    injection_parts.append(nav)
if "assets/js/crowrules-membership.js" not in text:
    injection_parts.append(js)

if not injection_parts:
    raise SystemExit(0)

idx = text.lower().rfind("</head>")
injection = "\n  " + "\n  ".join(injection_parts) + "\n"
text = text[:idx] + injection + text[idx:]

path.write_text(text, encoding="utf-8")
PY
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print)

      - name: Commit integrated pages
        run: |
          git config user.name "CrowRules Membership Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'

          if git diff --cached --quiet; then
            echo "All Memorials HTML pages already contain Universal CrowRules Membership and navigation."
            exit 0
          fi

          git commit -m "Add universal membership navigation to all Memorials pages"
          git push
