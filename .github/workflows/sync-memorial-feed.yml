name: Sync Memorials Feed

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Memorials feed from Supabase
        env:
          SUPABASE_URL: https://cevylpnoexugwgygvtgu.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ.get("SUPABASE_KEY","").strip()
          if not key:
              raise SystemExit("SUPABASE_PUBLISHABLE_KEY is missing. Add the Supabase publishable key to the repository Actions secrets.")

          params=urllib.parse.urlencode({
              "select":"id,slug,full_name,birth_date,passing_date,location,short_bio,portrait_url,featured,published,memorial_type,is_celebrity,profession,category,nationality,known_for,memorial_message,official_url,source_url,source_name,created_at",
              "published":"eq.true",
              "order":"passing_date.desc.nullslast,created_at.desc",
              "limit":"5000"
          })
          req=urllib.request.Request(
              f"{base}/rest/v1/memorials?{params}",
              headers={"apikey":key,"Authorization":f"Bearer {key}","Accept":"application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  rows=json.load(r)
          except urllib.error.HTTPError as e:
              detail=e.read().decode("utf-8","replace")
              raise SystemExit(f"Supabase request failed: HTTP {e.code}: {detail[:500]}")

          featured=[x for x in rows if x.get("featured")]
          deaths=[x for x in rows if x.get("passing_date")]
          feed={
              "generated_at":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "source":"CrowRules Memorials Supabase archive",
              "total":len(rows),
              "death_count":len(deaths),
              "featured_count":len(featured),
              "featured":featured,
              "memorials":rows
          }
          with open("data/memorial-feed.json","w",encoding="utf-8") as f:
              json.dump(feed,f,ensure_ascii=False,separators=(",",":"))
          PY

      - name: Publish feed
        run: |
          git config user.name "CrowRules Memorials Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memorial-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync Memorials feed from Supabase"
          git push
