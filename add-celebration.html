<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add a Celebration | CrowRules Memorials</title><link rel="stylesheet" href="css/memorials.css"><link rel="stylesheet" href="css/sitewide.css"><link rel="stylesheet" href="css/memorial-pages.css"></head><body><header></header><main><section class="page-hero"><span class="eyebrow">CREATE A MEMORIAL</span><h1>Add a Celebration</h1><p>Begin preserving the story of someone important to you. Your submission will be reviewed before it becomes part of the public CrowRules Memorials archive.</p></section><section style="max-width:760px;margin:auto"><form id="celebrationForm" class="archive-card" style="padding:32px"><label>Full name<input required id="fullName" class="form-input" placeholder="Their full name"></label><label>Birth date<input id="birthDate" type="date" class="form-input"></label><label>Passing date<input required id="passingDate" type="date" class="form-input"></label><label>Location<input id="location" class="form-input" placeholder="Optional"></label><label>Profession / known for<input id="profession" class="form-input" placeholder="Optional"></label><label>Short biography<textarea id="bio" class="form-input" rows="6" placeholder="Tell us about their life…"></textarea></label><label>Portrait URL<input id="portraitUrl" type="url" class="form-input" placeholder="Optional image URL"></label><button class="btn primary" type="submit">Submit Celebration</button><p id="formStatus" class="status"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/add-celebration.js"></script><script src="js/sitewide.js"></script></body></html>
