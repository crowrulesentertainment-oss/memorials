<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CrowRules Memorials — Remember. Honor. Preserve."><meta name="theme-color" content="#070708"><title>Membership | CrowRules Memorials</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/memorials.css?v=20260929.1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/crowrules-membership.js?v=20260929.1"></script><script src="assets/memorial-nav.js?v=20260929.1"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head><body data-page="membership"><main><section class="section"><div class="wrap" style="max-width:760px"><div class="eyebrow">One Account. One Universe.</div><h1 class="memorial-title">CrowRules Account</h1><div id="accountPanel" class="panel"><div class="loading">Checking your account…</div></div></div></section></main><script>document.addEventListener("DOMContentLoaded",async()=>{const el=document.getElementById("accountPanel");try{const u=await CrowRulesMembership.getUser();if(u){el.innerHTML='<div class="eyebrow">Signed In</div><h2 style="font:800 24px Orbitron;margin:8px 0">'+String(u.email||"CrowRules Member").replace(/[<>"']/g,"")+'</h2><p class="prose">Your CrowRules identity is active across Memorials.</p><button class="btn gold" id="signout" style="margin-top:18px">Sign Out</button>';document.getElementById("signout").onclick=async()=>{await CrowRulesMembership.signOut();location.reload()}}else{el.innerHTML='<div class="eyebrow">Not Signed In</div><h2 style="font:800 24px Orbitron;margin:8px 0">Join CrowRules</h2><p class="prose">Sign in or create your CrowRules account to participate in the community experience.</p><a class="btn gold" href="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/membership.html" style="margin-top:18px">Open CrowRules Membership</a>'}}catch(e){el.innerHTML='<div class="empty">Account status could not be checked.</div>'}});</script></body></html>
