<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a Memorial — CrowRules Memorials</title><link rel="stylesheet" href="css/memorials.css"></head><body><header><a class="brand" href="index.html">🕯️ CrowRules Memorials</a><nav><a href="index.html#celebrations">Celebrations</a><a href="index.html#archives">Archives</a><a href="index.html#stories">Stories</a></nav></header><main><section class="section"><div class="quote"><p class="eyebrow">CREATE A MEMORIAL</p><h2>Tell us about a life worth remembering.</h2><p>Authenticated CrowRules members can submit a memorial for review. Approved memorials become part of the archive.</p><form id="form" class="memorial-form"><input name="full_name" required placeholder="Full name"><input name="birth_date" type="date" placeholder="Birth date"><input name="passing_date" type="date" required><input name="profession" placeholder="Profession or role"><textarea name="short_bio" placeholder="Short biography"></textarea><textarea name="memorial_message" placeholder="Memorial message"></textarea><button class="btn primary">Submit for Review</button></form><p id="status"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/submit.js"></script></body></html>
