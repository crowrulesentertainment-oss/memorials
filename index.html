/* =========================================================
   FEATURED MEMORIALS HOME
========================================================= */

async function loadFeaturedMemorials(){

  const container=document.getElementById("featuredMemorials");

  if(!container) return;

  try{

    const {data,error}=await db
      .from("memorials")
      .select("id,slug,full_name,birth_date,passing_date,location,short_bio,portrait_url")
      .eq("published",true)
      .eq("featured",true)
      .order("passing_date",{ascending:false})
      .order("full_name",{ascending:true})
      .limit(6);

    if(error) throw error;

    const records=(data||[]).filter(Boolean);

    if(!records.length){
      container.innerHTML='<div class="wall-empty" style="grid-column:1/-1"><h3>No featured memorials yet</h3><p style="margin-top:8px">Featured memorials will appear here as they are selected.</p></div>';
      return;
    }

    container.innerHTML=records.map(renderFeaturedCard).join("");

  }catch(error){

    console.error("Featured memorials error:",error);

    container.innerHTML='<div class="empty-card" style="grid-column:1/-1"><h3>Featured memorials unavailable</h3><p style="margin-top:8px">Please refresh the page and try again.</p></div>';

  }

}

function renderFeaturedCard(memorial){

  const name=escapeHtml(memorial.full_name||"Unnamed Memorial");
  const slug=encodeURIComponent(memorial.slug||memorial.id||"");
  const birth=memorial.birth_date?formatDate(memorial.birth_date):"";
  const passing=memorial.passing_date?formatDate(memorial.passing_date):"";
  const dateLine=[birth,passing].filter(Boolean).join(" — ")||"A LIFE REMEMBERED";
  const bio=escapeHtml(memorial.short_bio||"Remembering a life, preserving a story, and honoring a legacy.");
  const image=memorial.portrait_url?escapeHtml(memorial.portrait_url):"";

  return `
    <article class="card">
      <div class="portrait">
        ${image
          ? `<img class="memorial-portrait-image" src="${image}" alt="Portrait of ${name}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
          : '<div class="archive-fallback">CR</div>'}
      </div>
      <div class="card-body">
        <div class="eyebrow" style="margin-bottom:8px">Featured</div>
        <h3>${name}</h3>
        <div class="dates">${escapeHtml(dateLine)}</div>
        <p>${bio}</p>
        <div class="card-foot">
          <span>${memorial.location?escapeHtml(memorial.location):"Life Story"}</span>
          <a class="section-link" href="memorial.html?slug=${slug}">VIEW MEMORIAL →</a>
        </div>
      </div>
    </article>`;
}

/* =========================================================
   RECENT TRIBUTES
========================================================= */

async function loadRecentTributes(){

  const container =
    document.getElementById(
      "recentTributes"
    );


  if(!container){

    return;

  }


  try{

    const {
      data,
      error
    } =

      await db
        .from("memorial_tributes")
        .select(`
          id,
          author_name,
          message,
          created_at,
          memorial_id
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(4);


    if(error){

      throw error;

    }


    if(
      !data ||
      !data.length
    ){

      container.innerHTML = `

        <div class="wall-empty">

          The first tribute can become part of the wall.

        </div>

      `;

      return;

    }


    container.innerHTML =
      data
        .map(
          renderTribute
        )
        .join("");

  }catch(error){

    console.error(
      "Recent tributes error:",
      error
    );


    container.innerHTML = `

      <div class="wall-empty">

        Recent tributes could not be loaded.

      </div>

    `;

  }

}


/* =========================================================
   TRIBUTE
========================================================= */

function renderTribute(
  tribute
){

  const author =
    escapeHtml(
      tribute.author_name ||
      "Community Member"
    );


  const message =
    escapeHtml(
      tribute.message
    );


  const time =
    escapeHtml(
      tribute.created_at
    );


  return `

    <article class="wall-item">

      <div class="tiny">
        A Tribute
      </div>

      <p>
        “${message}”
      </p>

      <strong>
        ${author}
      </strong>

    </article>

  `;

}


/* =========================================================
   FIND MEMORIAL
========================================================= */

async function findMemorial(
  searchName
){

  const clean =
    searchName.trim();


  if(!clean){

    return null;

  }


  const {
    data,
    error
  } =

    await db
      .from("memorials")
      .select(`
        id,
        slug,
        full_name
      `)
      .eq(
        "published",
        true
      )
      .ilike(
        "full_name",
        clean
      )
      .limit(1)
      .maybeSingle();


  if(error){

    throw error;

  }


  return data;

}

/* =========================================================
   LIGHT CANDLE
========================================================= */

async function lightCandle(){

  const submit =
    document.getElementById(
      "candleSubmit"
    );


  const nameInput =
    document.getElementById(
      "candleName"
    );


  const memorialInput =
    document.getElementById(
      "candleMemorial"
    );


  const messageInput =
    document.getElementById(
      "candleMessage"
    );


  const authorName =
    nameInput.value.trim();


  const memorialName =
    memorialInput.value.trim();


  const message =
    messageInput.value.trim();


  if(!memorialName){

    showToast(
      "Please enter the memorial name."
    );

    return;

  }


  submit.disabled =
    true;


  submit.textContent =
    "Lighting...";


  try{

    const memorial =
      await findMemorial(
        memorialName
      );


    if(!memorial){

      showToast(
        "We couldn't find that memorial."
      );

      return;

    }


    const {
      error
    } =

      await db
        .from(
          "memorial_candles"
        )
        .insert({

          memorial_id:
            memorial.id,

          author_name:
            authorName ||
            null,

          message:
            message ||
            null

        });


    if(error){

      throw error;

    }


    closeCandleModal();


    nameInput.value =
      "";

    messageInput.value =
      "";


    showToast(
      `A candle has been lit for ${memorial.full_name}. 🕯`
    );


    await loadMemorialStats();

  }catch(error){

    console.error(
      "Light candle error:",
      error
    );


    showToast(
      "The candle could not be recorded. Please try again."
    );

  }finally{

    submit.disabled =
      false;

    submit.textContent =
      "Light Candle 🕯";

  }

}

  window.location.href =
    "search.html?q=" +

}

  toast.textContent =

}

async function loadTotalVisitorCounter(){
  const element=document.getElementById("totalVisitorCount");
  if(!element) return;

  try{
    const { data, error } = await db.rpc("increment_memorial_visitors");
    if(error) throw error;

    const total=Number(data)||0;
    element.textContent=total.toLocaleString("en-US");
  }catch(error){
    console.error("CrowRules Memorials visitor counter error:",error);
    element.textContent="—";
  }
}

  pointer-events:none;

  z-index:1000;

  opacity:.035;

  background-image:

    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

}

a{

  color:inherit;

  text-decoration:none;

}

button,
input,
textarea{

  font:inherit;

}

button{

  cursor:pointer;

}

.container{

  width:
    min(
      1180px,
      calc(100% - 40px)
    );

  margin:auto;

}

.orbit{

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  letter-spacing:.08em;

}

/* =========================================================
   HEADER
========================================================= */

header{

  position:sticky;

  top:0;

  z-index:1500;

  background:
    rgba(5,5,5,.84);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid
    var(--line);

}

.nav{

  min-height:78px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

}

.brand{

  display:flex;

  align-items:center;

  gap:13px;

  flex-shrink:0;

}

.logo{

  width:42px;

  height:42px;

  border:
    1px solid
    rgba(201,168,106,.55);

  border-radius:50%;

  display:grid;

  place-items:center;

  color:var(--gold2);

  font-size:17px;

  box-shadow:
    0 0 30px
    rgba(201,168,106,.08);

}

.brand strong{

  display:block;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:14px;

  letter-spacing:.08em;

}

.brand span{

  display:block;

  color:var(--muted);

  font-size:9px;

  letter-spacing:.2em;

  text-transform:uppercase;

}

nav{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

}

nav a{

  color:#bdbdc4;

  font-size:10px;

  transition:.2s ease;

}

nav a:hover,
nav a.active{

  color:var(--gold2);

}

.nav-actions{

  display:flex;

  align-items:center;

  gap:8px;

}

/* =========================================================
   CROWNER BUTTON
========================================================= */

.crowner-button{

  min-height:38px;

  padding:
    0 13px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  border:
    1px solid
    rgba(201,168,106,.50);

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      rgba(201,168,106,.16),
      rgba(142,116,68,.08)
    );

  color:var(--gold2);

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:9px;

  font-weight:800;

  letter-spacing:.08em;

  transition:.2s ease;

}

.crowner-button:hover{

  border-color:
    var(--gold);

  background:
    rgba(201,168,106,.20);

  transform:
    translateY(-1px);

  box-shadow:
    0 0 25px
    rgba(201,168,106,.12);

}

.crowner-avatar{

  width:22px;

  height:22px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:
    rgba(201,168,106,.20);

  border:
    1px solid
    rgba(201,168,106,.45);

  font-size:8px;

}

/* =========================================================
   MOBILE MENU
========================================================= */

.menu{

  display:none;

  border:0;

  background:none;

  color:#fff;

  font-size:25px;

}

/* =========================================================
   UNIVERSAL MEMBERSHIP DRAWER
========================================================= */

.membership-overlay{

  position:fixed;

  inset:0;

  z-index:5000;

  background:
    rgba(0,0,0,.72);

  opacity:0;

  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility .25s ease;

}

.membership-overlay.open{

  opacity:1;

  visibility:visible;

}

.membership-drawer{

  position:absolute;

  top:0;

  right:0;

  width:
    min(
      430px,
      94vw
    );

  height:100%;

  overflow-y:auto;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(201,168,106,.15),
      transparent 280px
    ),

    linear-gradient(
      180deg,
      #111113,
      #070708
    );

  border-left:
    1px solid
    var(--line2);

  box-shadow:
    -30px 0 90px
    rgba(0,0,0,.65);

  transform:
    translateX(100%);

  transition:
    transform .3s ease;

}

.membership-overlay.open
.membership-drawer{

  transform:
    translateX(0);

}

.membership-header{

  position:sticky;

  top:0;

  z-index:3;

  min-height:72px;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(9,9,10,.94);

  backdrop-filter:
    blur(16px);

  border-bottom:
    1px solid
    var(--line);

}

.membership-title{

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:13px;

  font-weight:800;

  letter-spacing:.08em;

}

.membership-title span{

  color:var(--gold2);

}

.membership-close{

  width:38px;

  height:38px;

  border:
    1px solid
    var(--line2);

  border-radius:10px;

  background:#111113;

  color:#fff;

  font-size:22px;

  line-height:1;

}

.membership-close:hover{

  border-color:
    rgba(201,168,106,.55);

  color:var(--gold2);

}

.membership-body{

  padding:
    24px 20px 40px;

}

.membership-card{

  padding:21px;

  border:
    1px solid
    var(--line);

  border-radius:18px;

  background:
    rgba(255,255,255,.025);

  margin-bottom:12px;

}

.membership-label{

  color:var(--muted);

  font-size:9px;

  font-weight:800;

  letter-spacing:.18em;

  text-transform:uppercase;

}

.membership-name{

  margin-top:8px;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:18px;

  font-weight:800;

}

.membership-plan{

  display:inline-flex;

  margin-top:10px;

  padding:
    6px 10px;

  border:
    1px solid
    rgba(201,168,106,.30);

  border-radius:999px;

  background:
    rgba(201,168,106,.10);

  color:var(--gold2);

  font-size:9px;

  font-weight:800;

  letter-spacing:.1em;

  text-transform:uppercase;

}

.membership-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:16px;

}

.membership-stat{

  padding:13px;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:11px;

  background:#0b0b0d;

}

.membership-stat strong{

  display:block;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:14px;

}

.membership-stat small{

  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:8px;

  letter-spacing:.08em;

}

.membership-action{

  width:100%;

  min-height:46px;

  margin-top:9px;

  padding:
    0 15px;

  border:
    1px solid
    var(--line2);

  border-radius:10px;

  background:#101012;

  color:#eee;

  font-size:10px;

  font-weight:800;

  letter-spacing:.08em;

  text-align:left;

}

.membership-action:hover{

  border-color:
    rgba(201,168,106,.50);

  color:var(--gold2);

}

.membership-action.primary{

  border-color:
    var(--gold);

  background:
    var(--gold);

  color:#090806;

  text-align:center;

}

.membership-action.primary:hover{

  background:
    var(--gold2);

  color:#090806;

}

.membership-section{

  margin-top:25px;

}

.membership-section-title{

  margin-bottom:10px;

  color:#aaaab2;

  font-size:9px;

  font-weight:800;

  letter-spacing:.16em;

  text-transform:uppercase;

}

.membership-message{

  margin-top:12px;

  color:var(--muted);

  font-size:10px;

  line-height:1.65;

}

.membership-error{

  color:#d88787;

}

.membership-loading{

  color:var(--muted);

  font-size:11px;

}

/* =========================================================
   BUTTONS
========================================================= */

.btn{

  min-height:44px;

  padding:
    0 18px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  border:
    1px solid
    var(--line);

  border-radius:999px;

  background:#111113;

  color:#eee;

  transition:.2s ease;

}

.btn:hover{

  transform:
    translateY(-1px);

  border-color:
    rgba(201,168,106,.45);

}

.btn.gold{

  background:
    var(--gold);

  border-color:
    var(--gold);

  color:#090806;

  font-weight:800;

}

.btn.small{

  min-height:38px;

  padding:
    0 14px;

  font-size:10px;

}

.btn:disabled{

  opacity:.5;

  cursor:not-allowed;

  transform:none;

}

/* =========================================================
   HERO
========================================================= */

.hero{

  position:relative;

  min-height:680px;

  display:flex;

  align-items:center;

  overflow:hidden;

}

.hero:before{

  content:"";

  position:absolute;

  inset:0;

  z-index:-3;

  background:

    radial-gradient(
      circle at 73% 47%,
      rgba(201,168,106,.13),
      transparent 24rem
    );

}

.hero:after{

  content:"";

  position:absolute;

  inset:0;

  z-index:-2;

  background:

    linear-gradient(
      90deg,
      #050505 0%,
      rgba(5,5,5,.93) 34%,
      rgba(5,5,5,.55) 62%,
      rgba(5,5,5,.18) 80%,
      #050505 100%
    );

}

.hero-art{

  position:absolute;

  right:3%;

  top:9%;

  width:52%;

  height:82%;

  z-index:-4;

  opacity:.65;

  background:

    radial-gradient(
      circle at 50% 50%,
      transparent 0 20%,
      rgba(201,168,106,.10) 20.2% 20.4%,
      transparent 20.7%
    ),

    radial-gradient(
      circle at 50% 50%,
      transparent 0 34%,
      rgba(201,168,106,.13) 34.2% 34.4%,
      transparent 34.7%
    ),

    radial-gradient(
      circle at 50% 50%,
      transparent 0 49%,
      rgba(255,255,255,.06) 49.2% 49.4%,
      transparent 49.7%
    );

}

.hero-art:after{

  content:"";

  position:absolute;

  width:1px;

  height:100%;

  left:50%;

  top:0;

  background:

    linear-gradient(
      transparent,
      rgba(201,168,106,.25),
      transparent
    );

}

.hero-content{

  max-width:750px;

  padding:
    105px 0 110px;

}

.eyebrow{

  margin-bottom:20px;

  color:var(--gold2);

  font-size:10px;

  font-weight:700;

  letter-spacing:.28em;

  text-transform:uppercase;

}

.hero h1{

  max-width:850px;

  margin-bottom:25px;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:
    clamp(43px,7vw,83px);

  line-height:1.02;

  letter-spacing:-.045em;

}

.hero p{

  max-width:650px;

  color:#b9b9c0;

  font-size:16px;

}

.hero-buttons{

  display:flex;

  flex-wrap:wrap;

  gap:11px;

  margin-top:32px;

}

.hero-meta{

  display:flex;

  gap:34px;

  max-width:640px;

  margin-top:43px;

  padding-top:22px;

  border-top:
    1px solid
    var(--line);

}

.meta strong{

  display:block;

  color:#eee;

  font-size:22px;

}

.meta span{

  display:block;

  color:var(--muted);

  font-size:9px;

  letter-spacing:.16em;

  text-transform:uppercase;

}

/* =========================================================
   SECTIONS
========================================================= */

section{

  padding:88px 0;

}

.section-head{

  display:flex;

  align-items:end;

  justify-content:space-between;

  gap:20px;

  margin-bottom:30px;

}

.section-head h2{

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:
    clamp(22px,3vw,34px);

  letter-spacing:-.025em;

}

.section-head p{

  margin-top:6px;

  color:var(--muted);

  font-size:12px;

}

.section-link{

  color:var(--gold2);

  font-size:10px;

  letter-spacing:.08em;

  white-space:nowrap;

}

/* =========================================================
   LOADING
========================================================= */

.loading{

  min-height:200px;

  display:grid;

  place-items:center;

  color:var(--muted);

  font-size:11px;

  border:
    1px dashed
    var(--line);

  border-radius:var(--radius);

}

.spinner{

  width:25px;

  height:25px;

  border:
    2px solid
    rgba(255,255,255,.1);

  border-top-color:
    var(--gold);

  border-radius:50%;

  animation:
    spin .8s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

/* =========================================================
   ON THIS DAY
========================================================= */

.on-this-day{

  padding:35px;

  border:
    1px solid
    var(--line);

  border-radius:28px;

  background:

    radial-gradient(
      circle at 90% 20%,
      rgba(201,168,106,.1),
      transparent 240px
    ),

    #0a0a0b;

  box-shadow:var(--shadow);

}

.otd-grid{

  display:grid;

  grid-template-columns:
    1fr auto;

  align-items:center;

  gap:35px;

}

.otd-date{

  color:var(--gold2);

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:10px;

  letter-spacing:.18em;

}

.otd-grid h2{

  margin:8px 0;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:
    clamp(27px,4vw,48px);

  letter-spacing:-.03em;

}

.otd-grid p{

  max-width:680px;

  color:var(--muted);

  font-size:13px;

}

.candle{

  font-size:72px;

  filter:
    drop-shadow(
      0 0 25px
      rgba(201,168,106,.22)
    );

}

/* =========================================================
   TRIBUTE WALL
========================================================= */

.wall{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

}

.wall-item{

  min-height:150px;

  padding:22px;

  border:
    1px solid
    var(--line);

  border-radius:18px;

  background:#0b0b0c;

}

.wall-item .tiny{

  color:var(--gold2);

  font-size:8px;

  letter-spacing:.14em;

  text-transform:uppercase;

}

.wall-item p{

  margin:10px 0;

  color:#b7b7bd;

  font-size:11px;

}

.wall-item strong{

  color:#77777e;

  font-size:9px;

}

.wall-empty{

  grid-column:1/-1;

  padding:40px;

  text-align:center;

  color:var(--muted);

  border:
    1px dashed
    var(--line);

  border-radius:18px;

}

/* =========================================================
   EXPLORE
========================================================= */

.explore{

  display:grid;

  grid-template-columns:
    1.1fr .9fr;

  gap:18px;

}

.explore-box{

  min-height:290px;

  padding:32px;

  border:
    1px solid
    var(--line);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #111113,
      #080809
    );

}

.explore-box h3{

  margin-bottom:10px;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:24px;

}

.explore-box p{

  max-width:520px;

  color:var(--muted);

  font-size:12px;

}

.search{

  display:flex;

  gap:8px;

  margin-top:25px;

}

.search input{

  min-width:0;

  flex:1;

  height:44px;

  padding:
    0 18px;

  border:
    1px solid
    var(--line);

  border-radius:999px;

  outline:none;

  background:#050506;

  color:#fff;

}

.search input:focus{

  border-color:
    rgba(201,168,106,.55);

}

/* =========================================================
   CTA
========================================================= */

.footer-cta{

  padding:82px 20px;

  border-top:
    1px solid
    var(--line);

  border-bottom:
    1px solid
    var(--line);

  text-align:center;

}

.footer-cta h2{

  margin-bottom:13px;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

  font-size:
    clamp(25px,4vw,44px);

}

.footer-cta p{

  max-width:600px;

  margin:
    0 auto 25px;

  color:var(--muted);

  font-size:13px;

}

/* =========================================================
   FOOTER
========================================================= */

footer{

  padding:42px 0 55px;

  color:#77777e;

}

.footer-grid{

  display:grid;

  grid-template-columns:
    1.4fr repeat(3,1fr);

  gap:35px;

}

footer h4{

  margin-bottom:13px;

  color:#ddd;

  font-size:10px;

  letter-spacing:.15em;

  text-transform:uppercase;

}

footer a{

  display:block;

  margin:8px 0;

  color:#77777e;

  font-size:10px;

}

footer a:hover{

  color:var(--gold2);

}

.copyright{

  display:flex;

  justify-content:space-between;

  gap:15px;

  margin-top:35px;

  padding-top:20px;

  border-top:
    1px solid
    var(--line);

  font-size:9px;

}

/* =========================================================
   CANDLE MODAL
========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:3000;

  display:none;

  place-items:center;

  padding:20px;

  background:
    rgba(0,0,0,.8);

  backdrop-filter:
    blur(10px);

}

.modal.open{

  display:grid;

}

.modal-box{

  width:
    min(
      560px,
      100%
    );

  padding:29px;

  border:
    1px solid
    var(--line);

  border-radius:24px;

  background:#0d0d0f;

  box-shadow:
    0 30px 100px #000;

}

.modal-box h3{

  margin-bottom:7px;

  font-family:
    Orbitron,
    Montserrat,
    sans-serif;

}

.modal-box > p{

  margin-bottom:20px;

  color:var(--muted);

  font-size:11px;

}

.form-row{

  display:grid;

  gap:8px;

  margin:12px 0;

}

.form-row label{

  color:#aaa;

  font-size:9px;

  letter-spacing:.12em;

  text-transform:uppercase;

}

.form-row input,
.form-row textarea{

  width:100%;

  padding:12px;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  outline:none;

  background:#060607;

  color:#fff;

}

.form-row input:focus,
.form-row textarea:focus{

  border-color:
    rgba(201,168,106,.55);

}

.form-row textarea{

  min-height:90px;

  resize:vertical;

}

.modal-actions{

  display:flex;

  justify-content:flex-end;

  gap:9px;

  margin-top:18px;

}

/* =========================================================
   TOAST
========================================================= */

.toast{

  position:fixed;

  right:22px;

  bottom:22px;

  z-index:4000;

  max-width:350px;

  padding:
    14px 17px;

  border:
    1px solid
    rgba(201,168,106,.35);

  border-radius:14px;

  background:#101012;

  color:#eee;

  box-shadow:var(--shadow);

  opacity:0;

  transform:
    translateY(15px);

  pointer-events:none;

  transition:.25s ease;

  font-size:11px;

}

.toast.show{

  opacity:1;

  transform:
    translateY(0);

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1050px){

  nav{

    gap:12px;

  }

  nav a{

    font-size:9px;

  }

}

@media(max-width:920px){

  nav{

    display:none;

  }

  .menu{

    display:block;

  }

  .hero-art{

    right:-20%;

    width:75%;

    opacity:.32;

  }

  .archive-fallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font:700 42px Orbitron,Montserrat,sans-serif;
}
.cards{

    grid-template-columns:
      1fr 1fr;

  }

  .wall{

    grid-template-columns:
      1fr 1fr;

  }

  .explore{

    grid-template-columns:1fr;

  }

  .footer-grid{

    grid-template-columns:
      1fr 1fr;

  }

}

@media(max-width:620px){

  .container{

    width:
      min(
        100% - 28px,
        1180px
      );

  }

  .nav{

    min-height:68px;

  }

  .brand strong{

    font-size:11px;

  }

/* =========================================================
   FEATURED MEMORIALS HOME
========================================================= */

async function loadFeaturedMemorials(){

  const container=document.getElementById("featuredMemorials");

  if(!container) return;

  try{

    const {data,error}=await db
      .from("memorials")
      .select("id,slug,full_name,birth_date,passing_date,location,short_bio,portrait_url")
      .eq("published",true)
      .eq("featured",true)
      .order("passing_date",{ascending:false})
      .order("full_name",{ascending:true})
      .limit(6);

    if(error) throw error;

    const records=(data||[]).filter(Boolean);

    if(!records.length){
      container.innerHTML='<div class="wall-empty" style="grid-column:1/-1"><h3>No featured memorials yet</h3><p style="margin-top:8px">Featured memorials will appear here as they are selected.</p></div>';
      return;
    }

    container.innerHTML=records.map(renderFeaturedCard).join("");

  }catch(error){

    console.error("Featured memorials error:",error);

    container.innerHTML='<div class="empty-card" style="grid-column:1/-1"><h3>Featured memorials unavailable</h3><p style="margin-top:8px">Please refresh the page and try again.</p></div>';

  }

}

function renderFeaturedCard(memorial){

  const name=escapeHtml(memorial.full_name||"Unnamed Memorial");
  const slug=encodeURIComponent(memorial.slug||memorial.id||"");
  const birth=memorial.birth_date?formatDate(memorial.birth_date):"";
  const passing=memorial.passing_date?formatDate(memorial.passing_date):"";
  const dateLine=[birth,passing].filter(Boolean).join(" — ")||"A LIFE REMEMBERED";
  const bio=escapeHtml(memorial.short_bio||"Remembering a life, preserving a story, and honoring a legacy.");
  const image=memorial.portrait_url?escapeHtml(memorial.portrait_url):"";

  return `
    <article class="card">
      <div class="portrait">
        ${image
          ? `<img class="memorial-portrait-image" src="${image}" alt="Portrait of ${name}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
          : '<div class="archive-fallback">CR</div>'}
      </div>
      <div class="card-body">
        <div class="eyebrow" style="margin-bottom:8px">Featured</div>
        <h3>${name}</h3>
        <div class="dates">${escapeHtml(dateLine)}</div>
        <p>${bio}</p>
        <div class="card-foot">
          <span>${memorial.location?escapeHtml(memorial.location):"Life Story"}</span>
          <a class="section-link" href="memorial.html?slug=${slug}">VIEW MEMORIAL →</a>
        </div>
      </div>
    </article>`;
}

/* =========================================================
   RECENT TRIBUTES
========================================================= */

async function loadRecentTributes(){

  const container =
    document.getElementById(
      "recentTributes"
    );


  if(!container){

    return;

  }


  try{

    const {
      data,
      error
    } =

      await db
        .from("memorial_tributes")
        .select(`
          id,
          author_name,
          message,
          created_at,
          memorial_id
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(4);


    if(error){

      throw error;

    }


    if(
      !data ||
      !data.length
    ){

      container.innerHTML = `

        <div class="wall-empty">

          The first tribute can become part of the wall.

        </div>

      `;

      return;

    }


    container.innerHTML =
      data
        .map(
          renderTribute
        )
        .join("");

  }catch(error){

    console.error(
      "Recent tributes error:",
      error
    );


    container.innerHTML = `

      <div class="wall-empty">

        Recent tributes could not be loaded.

      </div>

    `;

  }

}


/* =========================================================
   TRIBUTE
========================================================= */

function renderTribute(
  tribute
){

  const author =
    escapeHtml(
      tribute.author_name ||
      "Community Member"
    );


  const message =
    escapeHtml(
      tribute.message
    );


  const time =
    escapeHtml(
      tribute.created_at
    );


  return `

    <article class="wall-item">

      <div class="tiny">
        A Tribute
      </div>

      <p>
        “${message}”
      </p>

      <strong>
        ${author}
      </strong>

    </article>

  `;

}


/* =========================================================
   FIND MEMORIAL
========================================================= */

async function findMemorial(
  searchName
){

  const clean =
    searchName.trim();


  if(!clean){

    return null;

  }


  const {
    data,
    error
  } =

    await db
      .from("memorials")
      .select(`
        id,
        slug,
        full_name
      `)
      .eq(
        "published",
        true
      )
      .ilike(
        "full_name",
        clean
      )
      .limit(1)
      .maybeSingle();


  if(error){

    throw error;

  }


  return data;

}

function openCandleModal(){

  const modal =
    document.getElementById(
      "candleModal"
    );


  if(!modal){

    return;

  }


  modal.classList.add(
    "open"
  );


  document.body.style.overflow =

}


function closeCandleModal(){

  const modal =
    document.getElementById(
      "candleModal"
    );


  if(!modal){

    return;

  }


  modal.classList.remove(
    "open"
  );


  document.body.style.overflow =

}


/* =========================================================
   LIGHT CANDLE
========================================================= */

async function lightCandle(){

  const submit =
    document.getElementById(
      "candleSubmit"
    );


  const nameInput =
    document.getElementById(
      "candleName"
    );


  const memorialInput =
    document.getElementById(
      "candleMemorial"
    );


  const messageInput =
    document.getElementById(
      "candleMessage"
    );


  const authorName =
    nameInput.value.trim();


  const memorialName =
    memorialInput.value.trim();


  const message =
    messageInput.value.trim();


  if(!memorialName){

    showToast(
      "Please enter the memorial name."
    );

    return;

  }


  submit.disabled =
    true;


  submit.textContent =
    "Lighting...";


  try{

    const memorial =
      await findMemorial(
        memorialName
      );


    if(!memorial){

      showToast(
        "We couldn't find that memorial."
      );

      return;

    }


    const {
      error
    } =

      await db
        .from(
          "memorial_candles"
        )
        .insert({

          memorial_id:
            memorial.id,

          author_name:
            authorName ||
            null,

          message:
            message ||
            null

        });


    if(error){

      throw error;

    }


    closeCandleModal();


    nameInput.value =
      "";

    messageInput.value =
      "";


    showToast(
      `A candle has been lit for ${memorial.full_name}. 🕯`
    );


    await loadMemorialStats();

  }catch(error){

    console.error(
      "Light candle error:",
      error
    );


    showToast(
      "The candle could not be recorded. Please try again."
    );

  }finally{

    submit.disabled =
      false;

    submit.textContent =
      "Light Candle 🕯";

  }

}

function searchMemorial(
  event
){

  event.preventDefault();


  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if(!query){

    window.location.href =
      "search.html";

    return;

  }


  window.location.href =
    "search.html?q=" +
    encodeURIComponent(
      query
    );

}

function loadDate(){

  const element =
    document.getElementById(
      "todayDate"
    );


  if(!element){

    return;

  }


  const date =
    new Date();


  const formatted =
    date.toLocaleDateString(
      "en-US",
      {

        month:"long",

        day:"numeric",

        year:"numeric"

      }
    );


  element.textContent =
    formatted.toUpperCase() +
    " • ON THIS DAY";

}

/* =========================================================
   TOAST
========================================================= */

function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){

    return;

  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.__crowToastTimer
  );


  window.__crowToastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3500
    );

}

/* =========================================================
   TOTAL VISITOR COUNTER
   Server-side lifetime count via Supabase RPC.
========================================================= */
async function loadTotalVisitorCounter(){
  const element=document.getElementById("totalVisitorCount");
  if(!element) return;

  try{
    const { data, error } = await db.rpc("increment_memorial_visitors");
    if(error) throw error;

    const total=Number(data)||0;
    element.textContent=total.toLocaleString("en-US");
  }catch(error){
    console.error("CrowRules Memorials visitor counter error:",error);
    element.textContent="—";
  }
}

  ]);

}
