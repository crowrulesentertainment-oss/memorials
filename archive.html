
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memorial Archive | CrowRules Memorials</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">CR</span><span>CROWRULES <small>MEMORIALS</small></span></a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a><a class="active" href="archive.html">Memorial Archive</a>
      <a href="stories.html">Life Stories</a><a href="candlelight.html">Candlelight</a>
      <a href="calendar.html">Remembrance Calendar</a><a class="nav-cta" href="submit.html">Create a Memorial</a>
    </nav>
  </header>
  <main>
    <section class="page-hero">
      <p class="eyebrow">THE MEMORIAL ARCHIVE</p>
      <h1>Lives remembered.</h1>
      <p>A growing collection of stories, tributes, and legacies.</p>
    </section>
    <section class="section-wrap">
      <div class="toolbar">
        <input id="archive-search" class="field" type="search" placeholder="Search names, stories, or places..." aria-label="Search memorials">
        <select id="archive-category" class="field" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="Family">Family</option>
          <option value="Community">Community</option>
          <option value="Arts">Arts</option>
          <option value="Service">Service</option>
        </select>
        <select id="archive-sort" class="field" aria-label="Sort memorials">
          <option value="name">Sort by name</option>
          <option value="newest">Most recent year of passing</option>
        </select>
      </div>
      <p id="archive-count" class="muted" aria-live="polite"></p>
      <div id="archive-results" class="memorial-grid"></div>
    </section>
  </main>
  <footer class="site-footer">
    <a href="about.html">About CrowRules Memorials</a>
    <p class="copyright">© <span data-year></span> CrowRules Entertainment</p>
  </footer>
