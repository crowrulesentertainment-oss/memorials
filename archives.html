<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archives | CrowRules Memorials</title><link rel="stylesheet" href="css/memorials.css"><link rel="stylesheet" href="css/sitewide.css"><link rel="stylesheet" href="css/memorial-pages.css"><style>.archive-tools{display:grid;grid-template-columns:1fr auto;gap:12px;margin:0 0 18px}.archive-tools input{width:100%;font-size:1rem}.archive-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 24px;color:var(--muted)}.archive-count{color:var(--gold);font-weight:700}.archive-card-link{display:block;color:inherit;text-decoration:none}.archive-card-link:hover .page-card{transform:translateY(-4px);border-color:rgba(205,169,120,.35)}.page-card{transition:transform .2s ease,border-color .2s ease}.archive-loading{padding:48px;text-align:center;border:1px solid var(--line);border-radius:18px;color:var(--muted)}@media(max-width:600px){.archive-tools{grid-template-columns:1fr}.archive-tools button{width:100%}}</style></head><body data-page="archives"><header></header><main><section class="page-hero"><span class="eyebrow">THE MEMORIAL ARCHIVE</span><h1>Archives</h1><p>Search the growing CrowRules Memorials archive by name, profession, story, or what someone was known for.</p></section><div class="archive-tools"><input id="archiveSearch" aria-label="Search the memorial archive" placeholder="Search a name, story, profession, or known for…" autocomplete="off"><button id="searchBtn">Search Archive</button></div><div class="archive-meta"><span>Explore published lives preserved in CrowRules Memorials.</span><span id="archiveCount" class="archive-count">Loading…</span></div><div id="status" class="status" aria-live="polite">Connecting to the archive…</div><section id="pageGrid" class="page-grid" aria-live="polite"><div class="archive-loading">Loading memorials…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/memorial-pages.js"></script><script src="js/sitewide.js"></script></body></html>
