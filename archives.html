<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archives | CrowRules Memorials</title><link rel="stylesheet" href="css/memorials.css"><link rel="stylesheet" href="css/sitewide.css"><link rel="stylesheet" href="css/memorial-pages.css"><style>.archive-tools{display:grid;grid-template-columns:1fr auto;gap:12px;margin:0 0 18px}.archive-tools input{width:100%;font-size:1rem}.archive-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 24px;color:var(--muted)}.archive-count{color:var(--gold);font-weight:700}.archive-card-link{display:block;color:inherit;text-decoration:none}.archive-card-link:hover .page-card{transform:translateY(-4px);border-color:rgba(205,169,120,.35)}.page-card{transition:transform .2s ease,border-color .2s ease}.archive-loading{padding:48px;text-align:center;border:1px solid var(--line);border-radius:18px;color:var(--muted)}@media(max-width:600px){.archive-tools{grid-template-columns:1fr}.archive-tools button{width:100%}} .archive-filters{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}.archive-filter{background:#11100f;border:1px solid var(--line);color:var(--muted);padding:11px 15px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700}.archive-filter:hover,.archive-filter.active{color:var(--gold);border-color:rgba(205,169,120,.45);background:rgba(205,169,120,.09)}.year-picker{margin:0 0 22px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.year-picker label{display:inline-block;margin:0 10px 0 0;color:var(--muted)}.year-picker select{background:#11100f;color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:10px;min-width:150px}</style></head><body data-page="archives"><header></header><main><section class="page-hero"><span class="eyebrow">THE MEMORIAL ARCHIVE</span><h1>Archives</h1><p>Search the growing CrowRules Memorials ar
